repos:
  - repo: local
    hooks:
      - id: agentqms-validate-artifacts
        name: AgentQMS artifact validation
        entry: bash -c 'PYTHONPATH=. python AgentQMS/agent_tools/compliance/validate_artifacts.py --staged'
        language: system
        pass_filenames: false
        stages: [commit]
      # Note: docs validation hook removed as docs/ is deprecated
      # Canonical knowledge validation runs in CI only


