name: AgentQMS Validation

on:
  push:
    paths:
      - "AgentQMS/**"
      - "docs/**"
      - ".agentqms/**"
      - ".github/workflows/agentqms-validation.yml"
  pull_request:
    paths:
      - "AgentQMS/**"
      - "docs/**"
      - ".agentqms/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate artifacts
        run: |
          python AgentQMS/agent_tools/compliance/validate_artifacts.py --all

      - name: Validate boundaries
        run: |
          python AgentQMS/agent_tools/compliance/validate_boundaries.py --json

      - name: Validate documentation index and manifest
        run: |
          python AgentQMS/agent_tools/documentation/auto_generate_index.py --validate
          python AgentQMS/agent_tools/documentation/validate_manifest.py

      - name: Validate documentation links
        run: |
          python AgentQMS/agent_tools/documentation/validate_links.py docs


